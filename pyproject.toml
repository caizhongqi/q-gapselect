[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "q-gapselect"
version = "0.1.0"
description = "Research implementation of heterogeneous-gap quantum combinatorial pure exploration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/caizhongqi/q-gapselect"

[project.optional-dependencies]
plots = [
  "matplotlib>=3.7",
]
vision = [
  "torch>=2.1",
  "torchvision>=0.16",
  "scikit-learn>=1.3",
]
guard = [
  "torch>=2.1",
  "transformers>=4.45,<5",
  "datasets>=2.20",
  "safetensors>=0.4",
]
atlas_text = [
  "torch>=2.1",
  "transformers>=4.45,<5",
  "scikit-learn>=1.3",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
]
atlas_graph = [
  "torch>=2.1",
  "torch-geometric>=2.5",
  "scikit-learn>=1.3",
]
atlas_time = [
  "torch>=2.1",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/qgapselect/qcollide/audio_atlas.py" = ["E501", "F401"]
"src/qgapselect/qcollide/audio_experiment.py" = ["E501"]
"src/qgapselect/qcollide/audio_pcm.py" = ["E501"]
"src/qgapselect/qcollide/cifar_sensitivity.py" = ["E501"]
"src/qgapselect/qcollide/pretrained_vision_results.py" = ["E501"]
"src/qgapselect/qcollide/query_budget_scaling.py" = ["E501", "B023"]

[tool.ruff.lint.isort]
known-first-party = ["qgapselect"]
