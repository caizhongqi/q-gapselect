name: stage17-cifar10-sanity

on:
  push:
    branches:
      - scratch/stage9-functional-collision
    paths:
      - .github/workflows/stage17-cifar10-sanity.yml
  workflow_dispatch:

jobs:
  sanity:
    strategy:
      fail-fast: false
      matrix:
        model: [cifar10_resnet20, cifar10_mobilenetv2_x0_5, cifar10_vgg11_bn]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Check pretrained CIFAR-10 accuracy
        run: |
          python - <<'PY'
          import torch
          from torch.utils.data import DataLoader
          from torchvision import datasets, transforms
          model_name='${{ matrix.model }}'
          mean=torch.tensor([0.4914,0.4822,0.4465]).view(1,3,1,1)
          std=torch.tensor([0.2023,0.1994,0.2010]).view(1,3,1,1)
          model=torch.hub.load('chenyaofo/pytorch-cifar-models',model_name,pretrained=True,trust_repo=True,force_reload=False).eval()
          ds=datasets.CIFAR10('data',train=False,download=True,transform=transforms.ToTensor())
          dl=DataLoader(ds,batch_size=512,shuffle=False,num_workers=2)
          good=n=0
          with torch.inference_mode():
              for x,y in dl:
                  z=model((x-mean)/std).argmax(1)
                  good += int((z==y).sum()); n += len(y)
          print('SANITY',model_name,'accuracy',good/n,'correct',good,'n',n,flush=True)
          PY
