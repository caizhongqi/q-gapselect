name: qcollide-neural-atlas-text-phase1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-neural-atlas
    paths:
      - '.github/workflows/qcollide-neural-atlas-text.yml'
      - 'configs/qcollide_neural_atlas_registry.json'
      - 'configs/qcollide_text_atlas_phase1.json'
      - 'src/qgapselect/qcollide/atlas_registry.py'
      - 'src/qgapselect/qcollide/text_atlas.py'
      - 'src/qgapselect/qcollide/text_atlas_results.py'
      - 'scripts/run_qcollide_text_atlas.py'
      - 'scripts/merge_qcollide_text_atlas.py'
      - 'tests/test_qcollide_atlas_registry.py'
      - 'tests/test_qcollide_text_atlas.py'
      - 'tests/test_qcollide_text_atlas_results.py'
      - 'pyproject.toml'

concurrency:
  group: qcollide-neural-atlas-text-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >-
          python -m pytest
          tests/test_qcollide_atlas_registry.py
          tests/test_qcollide_text_atlas.py
          tests/test_qcollide_text_atlas_results.py
          -q
      - run: python -m ruff check src/qgapselect/qcollide/atlas_registry.py src/qgapselect/qcollide/text_atlas.py src/qgapselect/qcollide/text_atlas_results.py scripts/run_qcollide_text_atlas.py scripts/merge_qcollide_text_atlas.py tests/test_qcollide_atlas_registry.py tests/test_qcollide_text_atlas.py tests/test_qcollide_text_atlas_results.py

  component:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: 'distilbert/distilbert-base-uncased', seed: 20260811}
          - {model: 'distilbert/distilbert-base-uncased', seed: 20260812}
          - {model: 'distilbert/distilbert-base-uncased', seed: 20260813}
          - {model: 'google-bert/bert-base-uncased', seed: 20260811}
          - {model: 'google-bert/bert-base-uncased', seed: 20260812}
          - {model: 'google-bert/bert-base-uncased', seed: 20260813}
          - {model: 'FacebookAI/roberta-base', seed: 20260811}
          - {model: 'FacebookAI/roberta-base', seed: 20260812}
          - {model: 'FacebookAI/roberta-base', seed: 20260813}
          - {model: 'microsoft/deberta-v3-small', seed: 20260811}
          - {model: 'microsoft/deberta-v3-small', seed: 20260812}
          - {model: 'microsoft/deberta-v3-small', seed: 20260813}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[atlas_text]'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qcollide-text-atlas-hf-${{ runner.os }}-${{ strategy.job-index }}
          restore-keys: |
            qcollide-text-atlas-hf-${{ runner.os }}-
      - run: mkdir -p artifacts-ci
      - name: Run text atlas component
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/run_qcollide_text_atlas.py \
            --config configs/qcollide_text_atlas_phase1.json \
            --model '${{ matrix.model }}' \
            --fixture-seed ${{ matrix.seed }} \
            --output artifacts-ci/component.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-text-atlas-${{ strategy.job-index }}
          path: artifacts-ci/component.json
          if-no-files-found: error
          retention-days: 21

  merge:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-text-atlas-*
          path: artifacts-components
      - run: |
          mkdir -p flattened
          find artifacts-components -name 'component.json' -print0 | while IFS= read -r -d '' file; do
            parent=$(basename "$(dirname "$file")")
            cp "$file" "flattened/${parent}.json"
          done
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/merge_qcollide_text_atlas.py
          --input-directory flattened
          --config configs/qcollide_text_atlas_phase1.json
          --output artifacts-ci/qcollide_text_atlas_phase1_merged.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-text-atlas-phase1-merged
          path: artifacts-ci/qcollide_text_atlas_phase1_merged.json
          if-no-files-found: error
          retention-days: 21
