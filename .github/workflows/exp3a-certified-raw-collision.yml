name: exp3a-certified-raw-collision

on:
  push:
    branches:
      - scratch/exp1-mnist-qco
    paths:
      - 'scratch/exp3a_certified_raw_collision.py'
      - '.github/workflows/exp3a-certified-raw-collision.yml'
  workflow_dispatch:

jobs:
  run-exp3a:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: |
          python -m py_compile scratch/exp1_mnist_qco.py
          python -m py_compile scratch/exp1b_mnist_strong_baselines.py
          python -m py_compile scratch/exp1c_qdsa_semantic_gate.py
          python -m py_compile scratch/exp2_qdsa_attack_effect_v2.py
          python -m py_compile scratch/exp3a_certified_raw_collision.py
      - name: Run Experiment 3A
        run: |
          python scratch/exp3a_certified_raw_collision.py \
            --epochs 3 \
            --targets 50 \
            --pool 512 \
            --out exp3a_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp3a-certified-raw-collision-results
          path: exp3a_out
          if-no-files-found: warn
