name: qcollide-neural-atlas-audio-speechcommands

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-neural-atlas
    paths:
      - '.github/workflows/qcollide-neural-atlas-audio-speechcommands.yml'
      - 'configs/qcollide_audio_speechcommands_phase2.json'
      - 'src/qgapselect/qcollide/audio_atlas.py'
      - 'src/qgapselect/qcollide/audio_experiment.py'
      - 'src/qgapselect/qcollide/audio_atlas_results.py'
      - 'scripts/run_qcollide_audio_atlas.py'
      - 'scripts/merge_qcollide_audio_atlas.py'
      - 'tests/test_qcollide_audio_atlas.py'

concurrency:
  group: qcollide-neural-atlas-audio-speechcommands-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_qcollide_audio_atlas.py -q
      - run: >-
          python -m ruff check --ignore E501,F401
          src/qgapselect/qcollide/audio_atlas.py
          src/qgapselect/qcollide/audio_experiment.py
          src/qgapselect/qcollide/audio_atlas_results.py
          scripts/run_qcollide_audio_atlas.py
          scripts/merge_qcollide_audio_atlas.py
          tests/test_qcollide_audio_atlas.py

  prepare-data:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
      - uses: actions/cache@v4
        with:
          path: .cache/qcollide-audio
          key: qcollide-speechcommands-v002-${{ runner.os }}
      - name: Download Speech Commands v0.02 once
        run: |
          python - <<'PY'
          from torchaudio.datasets import SPEECHCOMMANDS
          root = '.cache/qcollide-audio'
          for subset in ('training', 'validation', 'testing'):
              dataset = SPEECHCOMMANDS(
                  root,
                  url='speech_commands_v0.02',
                  subset=subset,
                  download=True,
              )
              print(subset, len(dataset))
          PY

  component:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        architecture: [audio_cnn, wav2vec2, ast]
        seed: [20260811, 20260812, 20260813]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
      - run: >-
          python -m pip install
          'transformers>=4.57,<5'
          'scikit-learn>=1.9'
          'safetensors>=0.7'
      - uses: actions/cache@v4
        with:
          path: .cache/qcollide-audio
          key: qcollide-speechcommands-v002-${{ runner.os }}
          fail-on-cache-miss: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qcollide-audio-hf-${{ runner.os }}-${{ matrix.architecture }}
          restore-keys: |
            qcollide-audio-hf-${{ runner.os }}-
      - run: mkdir -p artifacts-ci
      - name: Run Speech Commands atlas component
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: >-
          python scripts/run_qcollide_audio_atlas.py
          --config configs/qcollide_audio_speechcommands_phase2.json
          --architecture ${{ matrix.architecture }}
          --fixture-seed ${{ matrix.seed }}
          --output artifacts-ci/${{ matrix.architecture }}-seed-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-audio-${{ matrix.architecture }}-${{ matrix.seed }}
          path: artifacts-ci/*.json
          if-no-files-found: error
          retention-days: 21

  merge:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-audio-*
          path: artifacts-components
          merge-multiple: true
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/merge_qcollide_audio_atlas.py
          --input-directory artifacts-components
          --config configs/qcollide_audio_speechcommands_phase2.json
          --output artifacts-ci/qcollide_audio_speechcommands_phase2_merged.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-audio-speechcommands-phase2-merged
          path: artifacts-ci/qcollide_audio_speechcommands_phase2_merged.json
          if-no-files-found: error
          retention-days: 21
