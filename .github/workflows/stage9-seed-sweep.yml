name: stage9-seed-sweep

on:
  push:
    branches:
      - scratch/stage9-functional-collision
    paths:
      - scratch/stage9_fv1_arch_sweep_v2.py
      - .github/workflows/stage9-seed-sweep.yml
  workflow_dispatch:

jobs:
  seed-sweep:
    strategy:
      fail-fast: false
      matrix:
        model: [mlp, tinycnn, lenet5, resnet18, tinyvit]
        seed: [1, 13]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: |
          python -m py_compile scratch/stage9_fv1_arch_sweep.py
          python -m py_compile scratch/stage9_fv1_arch_sweep_v2.py
      - name: Run Stage 9 F-v1 v2
        run: |
          python scratch/stage9_fv1_arch_sweep_v2.py \
            --seed ${{ matrix.seed }} --epochs 2 \
            --models ${{ matrix.model }} \
            --baseline-reps 500 \
            --out stage9_out
      - name: Upload Stage 9 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-fv1-v2-${{ matrix.model }}-seed${{ matrix.seed }}
          path: stage9_out
          if-no-files-found: warn
