name: qcollide-graph-control-weight-calibration-v3

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-neural-atlas
    paths:
      - '.github/workflows/qcollide-graph-control-weight-calibration-v3.yml'
      - 'configs/qcollide_graph_cora_control_weight_calibration_v3.json'
      - 'src/qgapselect/qcollide/graph_control_weight_calibration.py'
      - 'scripts/run_qcollide_graph_control_weight_calibration_v3.py'
      - 'scripts/merge_qcollide_graph_control_weight_calibration_v3.py'
      - 'tests/test_qcollide_graph_control_weight_calibration_v3.py'

concurrency:
  group: qcollide-graph-control-weight-calibration-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_qcollide_graph_control_weight_calibration_v3.py -q
      - run: >-
          python -m ruff check
          src/qgapselect/qcollide/graph_control_weight_calibration.py
          scripts/run_qcollide_graph_control_weight_calibration_v3.py
          scripts/merge_qcollide_graph_control_weight_calibration_v3.py
          tests/test_qcollide_graph_control_weight_calibration_v3.py

  component:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        architecture: [gcn, graphsage, gat]
        seed: [100, 101]
        weight: [0.5, 1.0, 2.0, 5.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[atlas_graph]'
      - uses: actions/cache@v4
        with:
          path: .cache/qcollide-graph
          key: qcollide-cora-${{ runner.os }}
      - run: mkdir -p artifacts-ci
      - name: Run independent control-weight calibration cell
        run: >-
          python scripts/run_qcollide_graph_control_weight_calibration_v3.py
          --config configs/qcollide_graph_cora_control_weight_calibration_v3.json
          --architecture ${{ matrix.architecture }}
          --model-seed ${{ matrix.seed }}
          --control-loss-weight ${{ matrix.weight }}
          --output artifacts-ci/component.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-graph-cal-v3-${{ matrix.architecture }}-${{ matrix.seed }}-${{ matrix.weight }}
          path: artifacts-ci/component.json
          if-no-files-found: error
          retention-days: 21

  merge:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-graph-cal-v3-*
          path: artifacts-components
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/merge_qcollide_graph_control_weight_calibration_v3.py
          --input-directory artifacts-components
          --config configs/qcollide_graph_cora_control_weight_calibration_v3.json
          --output artifacts-ci/qcollide_graph_control_weight_calibration_v3.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-graph-control-weight-calibration-v3
          path: artifacts-ci/qcollide_graph_control_weight_calibration_v3.json
          if-no-files-found: error
          retention-days: 21
