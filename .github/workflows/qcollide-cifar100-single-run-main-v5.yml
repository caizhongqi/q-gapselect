name: qcollide-cifar100-single-run-main-v5

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-cifar-topology
    paths:
      - '.github/workflows/qcollide-cifar100-single-run-main-v5.yml'
      - 'configs/qcollide_cifar100_single_run_main_v5.json'
      - 'src/qgapselect/qcollide/cifar_support_sampling.py'
      - 'scripts/run_qcollide_cifar_single_run_support_aware.py'
      - 'tests/test_qcollide_cifar_support_sampling.py'

concurrency:
  group: qcollide-cifar100-single-run-main-v5-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu
          torch torchvision
      - run: python -m pip install 'scikit-learn>=1.9'
      - run: >-
          python -m pytest
          tests/test_qcollide_cifar_support_sampling.py
          tests/test_qcollide_cifar_single_run_selected.py
          tests/test_qcollide_cifar_selected_results.py
          -q
      - run: >-
          python -m ruff check
          src/qgapselect/qcollide/cifar_support_sampling.py
          scripts/run_qcollide_cifar_single_run_support_aware.py
          tests/test_qcollide_cifar_support_sampling.py

  prepare-data:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: >-
          python -m pip install
          'numpy>=1.24'
          'datasets>=2.20,<5'
          'Pillow>=10'
      - uses: actions/cache@v4
        id: raw-cache
        with:
          path: .cache/qcollide-cifar100-v4
          key: qcollide-cifar100-single-run-v4-snapshot-v1-${{ runner.os }}
      - name: Freeze CIFAR-100 raw snapshot from HF mirror
        if: steps.raw-cache.outputs.cache-hit != 'true'
        run: >-
          python scripts/prepare_qcollide_cifar100_hf_snapshot.py
          --output-directory .cache/qcollide-cifar100-v4
      - name: Verify prepared snapshot
        run: |
          test -f .cache/qcollide-cifar100-v4/train_images.npy
          test -f .cache/qcollide-cifar100-v4/train_labels.npy
          test -f .cache/qcollide-cifar100-v4/evaluation_images.npy
          test -f .cache/qcollide-cifar100-v4/evaluation_labels.npy
          test -f .cache/qcollide-cifar100-v4/snapshot_metadata.json

  component:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        architecture: [resnet18, vit_tiny, mlp_mixer]
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu
          torch torchvision
      - run: python -m pip install 'scikit-learn>=1.9'
      - uses: actions/cache@v4
        with:
          path: .cache/qcollide-cifar100-v4
          key: qcollide-cifar100-single-run-v4-snapshot-v1-${{ runner.os }}
          fail-on-cache-miss: true
      - run: mkdir -p artifacts-ci
      - name: Train once, select checkpoint, and measure support-aware topology
        run: >-
          python scripts/run_qcollide_cifar_single_run_support_aware.py
          --config configs/qcollide_cifar100_single_run_main_v5.json
          --architecture ${{ matrix.architecture }}
          --model-seed ${{ matrix.seed }}
          --output artifacts-ci/component.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-cifar100-single-run-v5-${{ matrix.architecture }}-${{ matrix.seed }}
          path: artifacts-ci/component.json
          if-no-files-found: error
          retention-days: 21

  merge:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-cifar100-single-run-v5-*
          path: artifacts-components
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/merge_qcollide_cifar_selected_main.py
          --input-directory artifacts-components
          --config configs/qcollide_cifar100_single_run_main_v5.json
          --output artifacts-ci/qcollide_cifar100_single_run_main_v5.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-cifar100-single-run-main-v5
          path: artifacts-ci/qcollide_cifar100_single_run_main_v5.json
          if-no-files-found: error
          retention-days: 21
