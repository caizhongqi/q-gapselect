name: qcollide-fixed-subset-capacity-v3

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-neural-atlas
    paths:
      - '.github/workflows/qcollide-fixed-subset-capacity-v3.yml'
      - 'configs/qcollide_fixed_subset_capacity_v3.json'
      - 'docs/qcollide_fixed_subset_capacity_estimator.md'
      - 'src/qgapselect/qcollide/fixed_subset_capacity.py'
      - 'scripts/run_qcollide_fixed_subset_capacity_v3.py'
      - 'scripts/merge_qcollide_fixed_subset_capacity_v3.py'
      - 'tests/test_qcollide_fixed_subset_capacity.py'

concurrency:
  group: qcollide-fixed-subset-capacity-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_qcollide_fixed_subset_capacity.py -q
      - run: >-
          python -m ruff check
          src/qgapselect/qcollide/fixed_subset_capacity.py
          scripts/run_qcollide_fixed_subset_capacity_v3.py
          scripts/merge_qcollide_fixed_subset_capacity_v3.py
          tests/test_qcollide_fixed_subset_capacity.py

  component:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        n: [256, 512, 1024, 2048, 4096, 8192, 16384]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e .
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/run_qcollide_fixed_subset_capacity_v3.py
          --config configs/qcollide_fixed_subset_capacity_v3.json
          --n ${{ matrix.n }}
          --output artifacts-ci/component.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-fixed-subset-v3-${{ matrix.n }}
          path: artifacts-ci/component.json
          if-no-files-found: error
          retention-days: 21

  merge:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-fixed-subset-v3-*
          path: artifacts-components
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/merge_qcollide_fixed_subset_capacity_v3.py
          --input-directory artifacts-components
          --config configs/qcollide_fixed_subset_capacity_v3.json
          --output artifacts-ci/qcollide_fixed_subset_capacity_v3.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-fixed-subset-capacity-v3-main
          path: artifacts-ci/qcollide_fixed_subset_capacity_v3.json
          if-no-files-found: error
          retention-days: 21
