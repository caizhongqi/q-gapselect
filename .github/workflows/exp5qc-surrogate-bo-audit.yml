name: exp5qc-surrogate-bo-audit

on:
  push:
    branches:
      - scratch/exp1-mnist-qco
    paths:
      - 'scratch/exp5qc_surrogate_bo_audit.py'
      - '.github/workflows/exp5qc-surrogate-bo-audit.yml'
  workflow_dispatch:

jobs:
  run-exp5qc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: python -m py_compile scratch/exp5qc_surrogate_bo_audit.py
      - name: Run Experiment 5QC
        run: |
          python scratch/exp5qc_surrogate_bo_audit.py \
            --epochs 3 \
            --targets 20 \
            --max-pool 2048 \
            --out exp5qc_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp5qc-surrogate-bo-audit-results
          path: exp5qc_out
          if-no-files-found: warn
