name: qcollide-neural-atlas-graph-cora-merge-recovery

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-neural-atlas
    paths:
      - '.github/workflows/qcollide-neural-atlas-graph-cora-merge-recovery.yml'
      - 'src/qgapselect/qcollide/graph_atlas_results.py'
      - 'scripts/merge_qcollide_graph_atlas.py'
      - 'configs/qcollide_graph_cora_phase2.json'

permissions:
  contents: read
  actions: read

jobs:
  recover-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-graph-cora-*
          path: artifacts-components
          run-id: 31480763092
          github-token: ${{ github.token }}
      - name: Preserve every component artifact
        run: |
          mkdir -p flattened artifacts-ci
          find artifacts-components -name 'component.json' -print0 | while IFS= read -r -d '' file; do
            parent=$(basename "$(dirname "$file")")
            cp "$file" "flattened/${parent}.json"
          done
          test "$(find flattened -name '*.json' | wc -l)" -eq 9
      - run: >-
          python scripts/merge_qcollide_graph_atlas.py
          --input-directory flattened
          --config configs/qcollide_graph_cora_phase2.json
          --output artifacts-ci/qcollide_graph_cora_phase2_merged.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-graph-cora-phase2-merged-recovered
          path: artifacts-ci/qcollide_graph_cora_phase2_merged.json
          if-no-files-found: error
          retention-days: 21
