name: qcollide-fashion-mnist

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/qcollide-fashion-mnist.yml"
      - "configs/qcollide_real_vision_fashion_mnist.json"
      - "docs/qcollide_fashion_mnist_protocol.md"
      - "scripts/run_qcollide_real_vision.py"
      - "scripts/merge_qcollide_real_vision.py"
      - "src/qgapselect/qcollide/vision.py"
      - "src/qgapselect/qcollide/vision_*.py"
      - "pyproject.toml"

concurrency:
  group: qcollide-fashion-mnist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  component:
    if: github.event_name != 'pull_request' || github.head_ref != 'agent/qcollide-neural-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        architecture: [cnn, tiny_vit]
        model-seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[vision]'
      - uses: actions/cache@v4
        with:
          path: .cache/qcollide-data
          key: fashion-mnist-v1-${{ runner.os }}
      - run: mkdir -p artifacts-ci
      - name: Run Fashion-MNIST component
        run: >-
          python scripts/run_qcollide_real_vision.py
          --config configs/qcollide_real_vision_fashion_mnist.json
          --architecture ${{ matrix.architecture }}
          --model-seed ${{ matrix.model-seed }}
          --output artifacts-ci/${{ matrix.architecture }}-seed-${{ matrix.model-seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-fashion-${{ matrix.architecture }}-${{ matrix.model-seed }}
          path: artifacts-ci/*.json
          if-no-files-found: error
          retention-days: 14

  merge:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[vision]'
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-fashion-*
          path: artifacts-components
          merge-multiple: true
      - run: mkdir -p artifacts-ci
      - name: Merge raw Fashion-MNIST rows
        run: >-
          python scripts/merge_qcollide_real_vision.py
          --input-directory artifacts-components
          --config configs/qcollide_real_vision_fashion_mnist.json
          --output artifacts-ci/qcollide_fashion_mnist_diagnostic.json
          --summary artifacts-ci/qcollide_fashion_mnist_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-fashion-mnist-merged
          path: artifacts-ci/*.json
          if-no-files-found: error
          retention-days: 14
