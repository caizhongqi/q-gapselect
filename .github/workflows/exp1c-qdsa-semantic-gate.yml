name: exp1c-qdsa-semantic-gate

on:
  push:
    branches:
      - scratch/exp1-mnist-qco
    paths:
      - 'scratch/exp1_mnist_qco.py'
      - 'scratch/exp1b_mnist_strong_baselines.py'
      - 'scratch/exp1c_qdsa_semantic_gate.py'
      - '.github/workflows/exp1c-qdsa-semantic-gate.yml'
  workflow_dispatch:

jobs:
  run-exp1c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: |
          python -m py_compile scratch/exp1_mnist_qco.py
          python -m py_compile scratch/exp1b_mnist_strong_baselines.py
          python -m py_compile scratch/exp1c_qdsa_semantic_gate.py
      - name: Run Experiment 1C
        run: |
          python scratch/exp1c_qdsa_semantic_gate.py \
            --epochs 3 \
            --targets 20 \
            --pool 512 \
            --out exp1c_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp1c-qdsa-semantic-gate-results
          path: exp1c_out
          if-no-files-found: warn
