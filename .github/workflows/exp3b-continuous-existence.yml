name: exp3b-continuous-existence

on:
  push:
    branches:
      - scratch/exp1-mnist-qco
    paths:
      - 'scratch/exp3b_continuous_existence.py'
      - '.github/workflows/exp3b-continuous-existence.yml'
  workflow_dispatch:

jobs:
  run-exp3b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: |
          python -m py_compile scratch/exp3b_continuous_existence.py
      - name: Run Experiment 3B
        run: |
          python scratch/exp3b_continuous_existence.py \
            --epochs 3 \
            --targets 20 \
            --pool 512 \
            --restarts 3 \
            --steps 300 \
            --lr 0.03 \
            --out exp3b_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp3b-continuous-existence-results
          path: exp3b_out
          if-no-files-found: warn
