name: exp5a-barrier-topology-audit

on:
  push:
    branches:
      - scratch/exp1-mnist-qco
    paths:
      - 'scratch/exp5a_barrier_topology_audit.py'
      - '.github/workflows/exp5a-barrier-topology-audit.yml'
  workflow_dispatch:

jobs:
  run-exp5a:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: python -m py_compile scratch/exp5a_barrier_topology_audit.py
      - name: Run Experiment 5A
        run: |
          python scratch/exp5a_barrier_topology_audit.py \
            --epochs 3 \
            --targets 20 \
            --pool 512 \
            --seed-budget 128 \
            --det-steps 120 \
            --restart-steps 180 \
            --restarts 8 \
            --restart-noise 0.05 \
            --out exp5a_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp5a-barrier-topology-audit-results
          path: exp5a_out
          if-no-files-found: warn
