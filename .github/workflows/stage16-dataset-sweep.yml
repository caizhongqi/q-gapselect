name: stage16-dataset-sweep

on:
  push:
    branches:
      - scratch/stage9-functional-collision
    paths:
      - scratch/stage16_dataset_sweep.py
      - .github/workflows/stage16-dataset-sweep.yml
  workflow_dispatch:

jobs:
  dataset-sweep:
    strategy:
      fail-fast: false
      matrix:
        dataset: [fashion, kmnist]
        model: [mlp, resnet18, tinyvit]
        seed: [1, 7, 13]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: |
          python -m py_compile scratch/stage9_fv1_arch_sweep.py
          python -m py_compile scratch/stage15_crossfamily_secret.py
          python -m py_compile scratch/stage16_dataset_sweep.py
      - name: Run dataset sweep
        run: |
          cd scratch
          python stage16_dataset_sweep.py \
            --dataset ${{ matrix.dataset }} \
            --model ${{ matrix.model }} \
            --seed ${{ matrix.seed }} \
            --epochs 3 \
            --out ../stage16_out
      - name: Upload Stage 16 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage16-${{ matrix.dataset }}-${{ matrix.model }}-seed${{ matrix.seed }}
          path: stage16_out
          if-no-files-found: warn
