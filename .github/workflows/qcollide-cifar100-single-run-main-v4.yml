name: qcollide-cifar100-single-run-main-v4

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-cifar-topology
    paths:
      - '.github/workflows/qcollide-cifar100-single-run-main-v4.yml'
      - 'configs/qcollide_cifar100_single_run_main_v4.json'
      - 'src/qgapselect/qcollide/cifar_single_run_selected.py'
      - 'scripts/run_qcollide_cifar_single_run_main.py'
      - 'tests/test_qcollide_cifar_single_run_selected.py'

concurrency:
  group: qcollide-cifar100-single-run-main-v4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu
          torch torchvision
      - run: python -m pip install 'scikit-learn>=1.9'
      - run: >-
          python -m pytest
          tests/test_qcollide_cifar_single_run_selected.py
          tests/test_qcollide_cifar_selected_results.py
          -q
      - run: >-
          python -m ruff check
          src/qgapselect/qcollide/cifar_single_run_selected.py
          scripts/run_qcollide_cifar_single_run_main.py
          tests/test_qcollide_cifar_single_run_selected.py

  component:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        architecture: [resnet18, vit_tiny, mlp_mixer]
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu
          torch torchvision
      - run: python -m pip install 'scikit-learn>=1.9'
      - uses: actions/cache@v4
        with:
          path: .cache/qcollide-data
          key: cifar100-main-v1-${{ runner.os }}
      - run: mkdir -p artifacts-ci
      - name: Train once, select checkpoint, and measure topology
        run: >-
          python scripts/run_qcollide_cifar_single_run_main.py
          --config configs/qcollide_cifar100_single_run_main_v4.json
          --architecture ${{ matrix.architecture }}
          --model-seed ${{ matrix.seed }}
          --output artifacts-ci/component.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-cifar100-single-run-v4-${{ matrix.architecture }}-${{ matrix.seed }}
          path: artifacts-ci/component.json
          if-no-files-found: error
          retention-days: 21

  merge:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-cifar100-single-run-v4-*
          path: artifacts-components
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/merge_qcollide_cifar_selected_main.py
          --input-directory artifacts-components
          --config configs/qcollide_cifar100_single_run_main_v4.json
          --output artifacts-ci/qcollide_cifar100_single_run_main_v4.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-cifar100-single-run-main-v4
          path: artifacts-ci/qcollide_cifar100_single_run_main_v4.json
          if-no-files-found: error
          retention-days: 21
