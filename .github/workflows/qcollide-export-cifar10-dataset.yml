name: qcollide-export-cifar10-dataset

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-cifar-topology
    paths:
      - '.github/workflows/qcollide-export-cifar10-dataset.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/qcollide-data
          key: cifar10-v1-${{ runner.os }}
          fail-on-cache-miss: true
      - name: Verify frozen CIFAR-10 cache
        run: |
          test -d .cache/qcollide-data/cifar-10-batches-py
          test -f .cache/qcollide-data/cifar-10-batches-py/data_batch_1
          test -f .cache/qcollide-data/cifar-10-batches-py/test_batch
          du -sh .cache/qcollide-data
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-cifar10-dataset-snapshot
          path: .cache/qcollide-data/cifar-10-batches-py
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
