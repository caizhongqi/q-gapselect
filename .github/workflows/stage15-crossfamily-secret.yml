name: stage15-crossfamily-secret

on:
  push:
    branches:
      - scratch/stage9-functional-collision
    paths:
      - scratch/stage15_crossfamily_secret.py
      - .github/workflows/stage15-crossfamily-secret.yml
  workflow_dispatch:

jobs:
  crossfamily-secret:
    strategy:
      fail-fast: false
      matrix:
        model: [mlp, tinycnn, lenet5, resnet18, tinyvit]
        seed: [1, 7, 13]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: |
          python -m py_compile scratch/stage9_fv1_arch_sweep.py
          python -m py_compile scratch/stage15_crossfamily_secret.py
      - name: Run cross-family secret bank
        run: |
          cd scratch
          python stage15_crossfamily_secret.py \
            --model ${{ matrix.model }} \
            --seed ${{ matrix.seed }} \
            --epochs 2 \
            --out ../stage15_out
      - name: Upload Stage 15 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage15-${{ matrix.model }}-seed${{ matrix.seed }}
          path: stage15_out
          if-no-files-found: warn
