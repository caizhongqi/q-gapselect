name: qcollide-neural-atlas-graph-cora

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-neural-atlas
    paths:
      - '.github/workflows/qcollide-neural-atlas-graph-cora.yml'
      - 'configs/qcollide_graph_cora_phase2.json'
      - 'src/qgapselect/qcollide/graph_atlas.py'
      - 'src/qgapselect/qcollide/graph_atlas_results.py'
      - 'scripts/run_qcollide_graph_atlas.py'
      - 'scripts/merge_qcollide_graph_atlas.py'
      - 'tests/test_qcollide_graph_atlas.py'
      - 'pyproject.toml'

concurrency:
  group: qcollide-neural-atlas-graph-cora-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_qcollide_graph_atlas.py -q
      - run: >-
          python -m ruff check
          src/qgapselect/qcollide/graph_atlas.py
          src/qgapselect/qcollide/graph_atlas_results.py
          scripts/run_qcollide_graph_atlas.py
          scripts/merge_qcollide_graph_atlas.py
          tests/test_qcollide_graph_atlas.py

  component:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        architecture: [gcn, graphsage, gat]
        seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[atlas_graph]'
      - uses: actions/cache@v4
        with:
          path: .cache/qcollide-graph
          key: qcollide-cora-${{ runner.os }}
      - run: mkdir -p artifacts-ci
      - name: Run Cora graph atlas component
        run: >-
          python scripts/run_qcollide_graph_atlas.py
          --config configs/qcollide_graph_cora_phase2.json
          --architecture ${{ matrix.architecture }}
          --model-seed ${{ matrix.seed }}
          --output artifacts-ci/component.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-graph-cora-${{ matrix.architecture }}-${{ matrix.seed }}
          path: artifacts-ci/component.json
          if-no-files-found: error
          retention-days: 21

  merge:
    needs: component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-graph-cora-*
          path: artifacts-components
          merge-multiple: true
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/merge_qcollide_graph_atlas.py
          --input-directory artifacts-components
          --config configs/qcollide_graph_cora_phase2.json
          --output artifacts-ci/qcollide_graph_cora_phase2_merged.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-graph-cora-phase2-merged
          path: artifacts-ci/qcollide_graph_cora_phase2_merged.json
          if-no-files-found: error
          retention-days: 21
