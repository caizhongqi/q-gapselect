name: exp3c-source-ball-robustness

on:
  push:
    branches:
      - scratch/exp1-mnist-qco
    paths:
      - 'scratch/exp3c_source_ball_robustness.py'
      - '.github/workflows/exp3c-source-ball-robustness.yml'
  workflow_dispatch:

jobs:
  run-exp3c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: python -m py_compile scratch/exp3c_source_ball_robustness.py
      - name: Run Experiment 3C
        run: |
          python scratch/exp3c_source_ball_robustness.py \
            --epochs 3 \
            --targets 20 \
            --pool 512 \
            --restarts 3 \
            --steps 250 \
            --lr 0.03 \
            --out exp3c_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp3c-source-ball-robustness-results
          path: exp3c_out
          if-no-files-found: warn
