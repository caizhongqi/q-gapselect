name: qcollide-training-audit-priority

on:
  workflow_dispatch:
  push:
    branches:
      - agent/qcollide-neural-atlas
    paths:
      - '.github/workflows/qcollide-training-audit-priority.yml'
      - 'src/qgapselect/qcollide/training_audit_priority.py'
      - 'scripts/build_qcollide_training_audit_priority.py'
      - 'tests/test_qcollide_training_audit_priority.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_qcollide_training_audit_priority.py -q
      - run: >-
          python -m ruff check
          src/qgapselect/qcollide/training_audit_priority.py
          scripts/build_qcollide_training_audit_priority.py
          tests/test_qcollide_training_audit_priority.py
      - uses: actions/download-artifact@v4
        with:
          name: qcollide-cifar10-main-topology-merged
          path: topology
          run-id: 31460911805
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: qcollide-cifar10-main-performance-merged
          path: performance
          run-id: 31460911805
          github-token: ${{ github.token }}
      - run: mkdir -p artifacts-ci
      - run: >-
          python scripts/build_qcollide_training_audit_priority.py
          --topology topology/qcollide_cifar10_topology_diagnostic.json
          --performance performance/qcollide_cifar10_checkpoint_performance.json
          --output artifacts-ci/qcollide_training_audit_priority_utility_table.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-training-audit-priority-utility-table
          path: artifacts-ci/qcollide_training_audit_priority_utility_table.json
          if-no-files-found: error
          retention-days: 21
