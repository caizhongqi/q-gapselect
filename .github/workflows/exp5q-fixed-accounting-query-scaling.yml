name: exp5q-fixed-accounting-query-scaling

on:
  push:
    branches:
      - scratch/exp1-mnist-qco
    paths:
      - 'scratch/exp5q_query_scaling_fixed_accounting.py'
      - '.github/workflows/exp5q-fixed-accounting-query-scaling.yml'
  workflow_dispatch:

jobs:
  run-exp5q:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax check
        run: python -m py_compile scratch/exp5q_query_scaling_fixed_accounting.py
      - name: Run Experiment 5Q
        run: |
          python scratch/exp5q_query_scaling_fixed_accounting.py \
            --epochs 3 \
            --targets 20 \
            --max-pool 2048 \
            --out exp5q_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp5q-fixed-accounting-query-scaling-results
          path: exp5q_out
          if-no-files-found: warn
