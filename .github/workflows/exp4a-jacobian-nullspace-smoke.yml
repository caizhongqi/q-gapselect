name: exp4a-jacobian-nullspace-smoke

on:
  push:
    branches:
      - scratch/exp1-mnist-qco
    paths:
      - '.github/workflows/exp4a-jacobian-nullspace-smoke.yml'
  workflow_dispatch:

jobs:
  run-exp4a-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Run fast smoke
        run: |
          python scratch/exp4a_jacobian_nullspace_pilot.py \
            --epochs 3 \
            --targets 3 \
            --pool 512 \
            --seed-budget 128 \
            --steps 40 \
            --step-size 0.020 \
            --out exp4a_smoke_out
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp4a-jacobian-nullspace-smoke-results
          path: exp4a_smoke_out
          if-no-files-found: warn
