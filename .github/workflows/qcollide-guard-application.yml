name: qcollide-guard-application

on:
  push:
    branches:
      - agent/qcollide-cifar-topology
    paths:
      - 'src/qgapselect/qcollide/guard_application.py'
      - 'scripts/run_qcollide_guard_application.py'
      - 'tests/test_qcollide_guard_application.py'
      - 'pyproject.toml'
      - '.github/workflows/qcollide-guard-application.yml'
  pull_request:
    paths:
      - 'src/qgapselect/qcollide/guard_application.py'
      - 'scripts/run_qcollide_guard_application.py'
      - 'tests/test_qcollide_guard_application.py'
      - 'pyproject.toml'
      - '.github/workflows/qcollide-guard-application.yml'
  workflow_dispatch:

jobs:
  component:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        guard:
          - protectai/deberta-v3-base-prompt-injection-v2
          - fmops/distilbert-prompt-injection
        seed:
          - 20260811
          - 20260812
          - 20260813
          - 20260814
          - 20260815
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[guard,dev]'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: guard-hf-${{ runner.os }}-${{ matrix.guard }}
          restore-keys: |
            guard-hf-${{ runner.os }}-
      - run: python -m pytest tests/test_qcollide_guard_application.py -q
      - name: Run guard collision application
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          mkdir -p artifacts-ci
          slug=$(echo '${{ matrix.guard }}' | tr '/.' '__')
          python scripts/run_qcollide_guard_application.py \
            --guard-model '${{ matrix.guard }}' \
            --behavior-model 'HuggingFaceTB/SmolLM2-135M-Instruct' \
            --dataset 'deepset/prompt-injections' \
            --per-class 160 \
            --batch-size 16 \
            --max-length 128 \
            --logit-features 512 \
            --benign-acceptance 0.95 \
            --seed '${{ matrix.seed }}' \
            --output "artifacts-ci/qcollide_guard_${slug}_seed${{ matrix.seed }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-guard-${{ strategy.job-index }}-${{ matrix.seed }}
          path: artifacts-ci/*.json
          retention-days: 14

  merge:
    needs: component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qcollide-guard-*
          path: artifacts-downloaded
          merge-multiple: true
      - name: Merge and aggregate main-table records
        run: |
          python - <<'PY'
          import json
          import statistics
          from collections import defaultdict
          from pathlib import Path

          records = []
          for path in sorted(Path('artifacts-downloaded').glob('*.json')):
              records.append(json.loads(path.read_text(encoding='utf-8')))

          grouped = defaultdict(list)
          for record in records:
              grouped[record['guard_model']].append(record)

          aggregates = []
          for guard, rows in sorted(grouped.items()):
              capacities = [float(row['collision_graph']['matching_capacity']) for row in rows]
              capacity_fractions = [float(row['collision_graph']['capacity_fraction']) for row in rows]
              edge_counts = [float(row['collision_graph']['edge_count']) for row in rows]
              injection_acceptance = [float(row['domain']['injection_acceptance_observed']) for row in rows]
              benign_acceptance = [float(row['domain']['benign_acceptance_observed']) for row in rows]
              classical = [float(row['query_proxies']['packed_classical_discovery_proxy']) for row in rows]
              quantum = [float(row['query_proxies']['packed_quantum_discovery_proxy']) for row in rows]
              positive_rows = [row for row in rows if row['collision_graph']['matching_capacity'] > 0]
              positive_ratios = [
                  float(row['query_proxies']['packed_classical_discovery_proxy'])
                  / float(row['query_proxies']['packed_quantum_discovery_proxy'])
                  for row in positive_rows
                  if float(row['query_proxies']['packed_quantum_discovery_proxy']) > 0
              ]
              aggregates.append({
                  'guard_model': guard,
                  'seed_count': len(rows),
                  'seeds': sorted(int(row['seed']) for row in rows),
                  'unique_fixture_count': len({row['fixture_sha256'] for row in rows}),
                  'nonzero_collision_seed_fraction': sum(value > 0 for value in capacities) / len(rows),
                  'matching_capacity_mean': statistics.mean(capacities),
                  'matching_capacity_pstdev': statistics.pstdev(capacities),
                  'capacity_fraction_mean': statistics.mean(capacity_fractions),
                  'edge_count_mean': statistics.mean(edge_counts),
                  'injection_acceptance_mean': statistics.mean(injection_acceptance),
                  'benign_acceptance_mean': statistics.mean(benign_acceptance),
                  'packed_classical_proxy_mean': statistics.mean(classical),
                  'packed_quantum_proxy_mean': statistics.mean(quantum),
                  'classical_to_quantum_proxy_ratio_mean_nonzero_capacity': (
                      statistics.mean(positive_ratios) if positive_ratios else None
                  ),
              })

          payload = {
              'artifact_type': 'qcollide_guard_application_main_table',
              'schema_version': 3,
              'records': records,
              'aggregates': aggregates,
              'claim_boundary': {
                  'public_existing_prompts_only': True,
                  'generated_jailbreak_content': False,
                  'quantum_values_are': 'analytic endpoint-query proxies',
                  'multi_seed_results_are_empirical': True,
                  'proxy_ratio_reported_only_when_matching_capacity_is_positive': True,
              },
          }
          Path('artifacts-ci').mkdir(exist_ok=True)
          Path('artifacts-ci/qcollide_guard_application_main_table.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qcollide-guard-application-main-table
          path: artifacts-ci/qcollide_guard_application_main_table.json
          retention-days: 14
